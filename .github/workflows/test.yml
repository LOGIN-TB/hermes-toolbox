name: test
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate-skills:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - run: python -m pip install "PyYAML==6.0.3"
      - run: python tests/validate_skills.py

  hermes-skill-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Install pinned Hermes Agent
        run: |
          mkdir /tmp/hermes-agent
          git -C /tmp/hermes-agent init
          for attempt in 1 2 3; do
            git -C /tmp/hermes-agent fetch --depth=1 https://github.com/NousResearch/hermes-agent.git 37d5fca92666347877255d7603a995fe86298788 && break
            test "$attempt" -lt 3
            sleep "$((attempt * 2))"
          done
          git -C /tmp/hermes-agent checkout --detach FETCH_HEAD
          test "$(git -C /tmp/hermes-agent rev-parse HEAD)" = 37d5fca92666347877255d7603a995fe86298788
          python -m pip install -e /tmp/hermes-agent
      - name: Inspect and install every curated document skill
        run: >-
          python tests/validate_skills.py --hermes-smoke
          --base-url "https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}"

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install "PyYAML==6.0.3"
      - run: python -m compileall -q skills/gym tests
      - run: python -m unittest discover -s tests -v
      - run: node tests/test_web.mjs
